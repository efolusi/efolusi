map $host $efolusi_upstream {
    hostnames;
    dev-efolusi.efolusi.com 127.0.0.1:13000;
    efolusi.com             127.0.0.1:3000;
    www.efolusi.com         127.0.0.1:3000;
    default                 127.0.0.1:3000;
}

server {
    listen 80;
    server_name efolusi.com www.efolusi.com dev-efolusi.efolusi.com;

    location / {
        proxy_pass http://$efolusi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
