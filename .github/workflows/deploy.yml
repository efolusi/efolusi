name: Deploy

# Production deploys only from a v* tag on main, or a manual run on such a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: efolusi-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only a tag in this repo deploys; the job runs on a GitHub-hosted runner.
    if: github.repository == 'efolusi/efolusi' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Refuse anything but a v* tag on main
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The Worker's own secrets go up with the deploy. A missing one stops the deploy.
      - name: Write the Worker secrets file
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          node -e '
            const names = ["BREVO_API_KEY", "SENTRY_DSN", "EMAIL_FROM", "EMAIL_TO"];
            const missing = names.filter((n) => !process.env[n]);
            if (missing.length) { console.error("missing secrets: " + missing.join(", ")); process.exit(1); }
            const out = Object.fromEntries(names.map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
          ' "$RUNNER_TEMP/worker-secrets.json"
      - run: pnpm run deploy -- --secrets-file "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
