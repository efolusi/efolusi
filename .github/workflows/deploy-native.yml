name: Deploy native web

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-efolusi-web-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: [self-hosted, Linux, X64, foundation-dev-web]
    timeout-minutes: 45
    steps:
      - name: Select exact environment
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$GITHUB_REF_NAME" in
            dev)
              echo "environment=dev" >>"$GITHUB_OUTPUT"
              echo "health_url=http://127.0.0.1:13000/" >>"$GITHUB_OUTPUT"
              ;;
            main)
              echo "environment=prod" >>"$GITHUB_OUTPUT"
              echo "health_url=http://127.0.0.1:3000/" >>"$GITHUB_OUTPUT"
              ;;
            *) exit 65 ;;
          esac

      - name: Pull, build, restart, and verify
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_BUILD_SCRIPT: build
          EFOLUSI_DEPLOY_ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: |
          set -Eeuo pipefail
          test -s "$HOME/.nvm/nvm.sh"
          source "$HOME/.nvm/nvm.sh"
          nvm use 22
          /home/deploy/bin/efolusi-deploy \
            efolusi \
            "${{ steps.target.outputs.environment }}" \
            "$GITHUB_REF_NAME" \
            git@github.com:efolusi/efolusi.git \
            "${{ steps.target.outputs.health_url }}"
