name: Deploy native landing page

# Production deploys only from a pushed v* tag on main, or by hand from main.
# A push to a branch or a pull request never reaches the efolusi-prod runner.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-efolusi-prod-web
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, efolusi-prod]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Refuse a commit that is not on main
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Pull, build, restart, and verify landing page
        run: |
          set -Eeuo pipefail
          /usr/local/sbin/efolusi-landing-deploy "$GITHUB_SHA" main
