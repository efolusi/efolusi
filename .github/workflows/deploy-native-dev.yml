name: Deploy native landing page

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-efolusi-${{ github.ref_name }}-web
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: [self-hosted, Linux, X64, efolusi]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select exact environment
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF_NAME" == dev ]]; then
            echo "environment=dev" >>"$GITHUB_OUTPUT"
            echo "health_url=http://127.0.0.1:13000/" >>"$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            echo "environment=prod" >>"$GITHUB_OUTPUT"
            echo "health_url=http://127.0.0.1:3000/" >>"$GITHUB_OUTPUT"
          else
            exit 65
          fi
      - name: Pull, build, restart, and verify landing page
        env:
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_BUILD_SCRIPT: build
        run: |
          set -Eeuo pipefail
          source "$HOME/.nvm/nvm.sh"
          nvm use 22
          /home/deploy/bin/efolusi-deploy \
            efolusi \
            "${{ steps.target.outputs.environment }}" \
            "$GITHUB_REF_NAME" \
            git@github.com:efolusi/efolusi.git \
            "${{ steps.target.outputs.health_url }}"
