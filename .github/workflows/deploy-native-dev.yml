name: Deploy native landing page

on:
  # Only what CI has passed is deployed: workflow_run fires with the exact SHA
  # CI tested, and the job proceeds only if that push run succeeded. GitHub
  # delivers workflow_run to this file's copy on the default branch.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-efolusi-${{ github.event.workflow_run.head_branch || github.ref_name }}-web
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'dev' || github.event.workflow_run.head_branch == 'main')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref_name == 'dev' || github.ref_name == 'main'))
    # On workflow_run, github.ref_name and github.sha name the default branch,
    # not the commit CI tested, so the job keys on TARGET_*.
    runs-on: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && fromJSON('["self-hosted", "Linux", "X64", "efolusi-prod"]') || fromJSON('["self-hosted", "Linux", "X64", "efolusi-dev"]') }}
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pull, build, restart, and verify landing page
        env:
        run: |
          set -Eeuo pipefail
          # GitHub ignores env entries named GITHUB_*, so hand the deploy script the tested
          # SHA through the shell. Under workflow_run the runner default is the default-branch head.
          export GITHUB_SHA="$TARGET_SHA"
          /usr/local/sbin/efolusi-landing-deploy \
            "$GITHUB_SHA" \
            "$TARGET_BRANCH"
