name: Deploy native dev web

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-efolusi-dev-web
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'dev'
    runs-on: [self-hosted, Linux, X64, foundation-dev-web]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Build, restart, and verify isolated dev web
        env:
          EFOLUSI_EXTERNAL_ORIGIN: https://dev-efolusi.efolusi.com
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          exec 9>"/home/foundation-runner/native-deploy.lock"
          flock -w 2700 9
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build
          pm2 delete efolusi-dev-efolusi-web 2>/dev/null || true
          env -i \
            HOME="$HOME" \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            PM2_HOME="$HOME/.pm2" \
            NODE_ENV="production" \
            EFOLUSI_EXTERNAL_ORIGIN="$EFOLUSI_EXTERNAL_ORIGIN" \
            HOSTNAME="127.0.0.1" \
            PORT="13000" \
            pm2 start "$GITHUB_WORKSPACE/node_modules/next/dist/bin/next" \
              --name efolusi-dev-efolusi-web \
              --cwd "$GITHUB_WORKSPACE" \
              -- start -H 127.0.0.1 -p 13000
          pm2 save
          pm2 jlist | node -e '
            const fs = require("node:fs");
            const apps = JSON.parse(fs.readFileSync(0, "utf8"));
            const app = apps.find((candidate) => candidate.name === "efolusi-dev-efolusi-web");
            if (!app || app.pm2_env?.status !== "online" || app.pm2_env?.pm_cwd !== process.env.GITHUB_WORKSPACE) {
              process.exit(1);
            }
          '
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:13000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"
