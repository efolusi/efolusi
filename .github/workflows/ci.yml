name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: efolusi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pushes and same-repo pull requests run on the self-hosted runner. A pull
    # request from a fork never reaches it and runs on a GitHub-hosted runner.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64", "efolusi-dev"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
      - run: test "$(node --version)" = "v$(cat .nvmrc)"
      # Node 25+ ships without corepack, so pnpm is installed at the version in package.json.
      - run: npm install -g pnpm@11.24.0
      - run: test "$(pnpm --version)" = "11.24.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
