name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: efolusi-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, efolusi]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test native Node build
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$HOME/.nvm/nvm.sh"
          source "$HOME/.nvm/nvm.sh"
          nvm use 22
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm test
          corepack pnpm run build
